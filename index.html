<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>日本語 Practice</title>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.23.0/dist/livekit-client.umd.min.js"></script>
<!-- for the avatar modules in /avatar/, which are only fetched when the avatar is switched on -->
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
  "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.5.5/lib/three-vrm.module.min.js"
} }
</script>
<style>
  /* ---------- tokens: day (light) and night (dark) ---------- */
  :root {
    --text: #0b3350; --muted: #35586f; --bg: #ffffff; --panel: #eef9ff; --line: rgba(11, 51, 80, .16);
    --accent: #0a86cc; --me: #0a86cc; --link: #075f9e; --good: #1c7c2c; --bad: #c2332b; --warn: #9a6200;
    --glass-a: rgba(255, 255, 255, .76); --glass-b: rgba(255, 255, 255, .48);
    --rim: rgba(255, 255, 255, .85); --hl: rgba(255, 255, 255, .95); --drop: rgba(8, 70, 130, .42);
    --inset: rgba(255, 255, 255, .42); --inset-rim: rgba(255, 255, 255, .78);
    --agent-a: rgba(255, 255, 255, .94); --agent-b: rgba(255, 255, 255, .68);
    --me-a: rgba(204, 242, 255, .96); --me-b: rgba(126, 214, 250, .82);
    /* background marble: ~70% close blues (w4 sky, w5 mid, w7 pale), thin pale veins (w1), a little aqua (w3) and mint (w2, w6) */
    --sky: #8cc6fb;
    --w1: #e3f3ff; --w2: #a6e9b4; --w3: #9be9e6; --w4: #8cc6fb; --w5: #6eaff5; --w6: #c2f0d0; --w7: #a8d6fd;
    --heat-0: rgba(11, 51, 80, .13); --heat-1: #8fd8e8; --heat-2: #3fb9c6; --heat-3: #2aa36a; --heat-4: #157a2e;
    /* issue types: categorical slots in fixed order */
    --t-particle: #2a78d6; --t-wa_ga: #eb6834; --t-conjugation: #1baf7a; --t-word_choice: #eda100;
    --t-register: #e87ba4; --t-filler: #008300; --t-other: #6250d6;
    /* JLPT levels: ordinal blue ramp, N5 light -> N1 dark */
    --lv-N5: #86b6ef; --lv-N4: #5598e7; --lv-N3: #2a78d6; --lv-N2: #1c5cab; --lv-N1: #104281;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --text: #eaf6ff; --muted: #a8c4d8; --bg: #07162e; --panel: #17304f; --line: rgba(255, 255, 255, .16);
      --accent: #5cc8ff; --me: #5cc8ff; --link: #86d6ff; --good: #7be08a; --bad: #ff8a7c; --warn: #f2bd5a;
      --glass-a: rgba(44, 76, 128, .56); --glass-b: rgba(10, 24, 54, .58);
      --rim: rgba(255, 255, 255, .24); --hl: rgba(255, 255, 255, .34); --drop: rgba(0, 0, 0, .6);
      --inset: rgba(255, 255, 255, .07); --inset-rim: rgba(255, 255, 255, .16);
      --agent-a: rgba(255, 255, 255, .17); --agent-b: rgba(255, 255, 255, .08);
      --me-a: rgba(92, 200, 255, .40); --me-b: rgba(20, 130, 210, .34);
      --sky: #0a2a6a;
      --w1: #3d7fe0; --w2: #1f9a78; --w3: #1a8fb0; --w4: #123f9c; --w5: #071a52; --w6: #2aa98a; --w7: #1a50b4;
      --heat-0: rgba(255, 255, 255, .08); --heat-1: #14505f; --heat-2: #1b8388; --heat-3: #35b67d; --heat-4: #8be88f;
      --t-particle: #3987e5; --t-wa_ga: #d95926; --t-conjugation: #199e70; --t-word_choice: #c98500;
      --t-register: #d55181; --t-filler: #0ca30c; --t-other: #9085e9;
      --lv-N5: #184f95; --lv-N4: #2a78d6; --lv-N3: #5598e7; --lv-N2: #86b6ef; --lv-N1: #b7d3f6;
    }
  }
  /* registered so the orb's colours can cross-fade between states */
  @property --o1 { syntax: "<color>"; inherits: true; initial-value: #b9f36b; }
  @property --o2 { syntax: "<color>"; inherits: true; initial-value: #46c426; }
  @property --o3 { syntax: "<color>"; inherits: true; initial-value: #0f7d14; }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; color: var(--text); background: #8cc6fb; overflow: hidden;
    font: 16px/1.65 "Hiragino Maru Gothic ProN", Frutiger, "Frutiger Linotype", "Segoe UI", "Myriad Pro", "Lucida Grande",
      "Hiragino Sans", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  [hidden] { display: none !important; }
  a { color: var(--link); text-underline-offset: 3px; }
  code { font-size: .9em; padding: 1px 6px; border-radius: 6px; background: var(--inset); border: 1px solid var(--inset-rim); }
  :focus-visible { outline: 3px solid var(--hl); outline-offset: 3px; box-shadow: 0 0 0 6px rgba(10, 134, 204, .55); }

  /* ---------- background: marbled swirls (blurred blobs warped by noise), completely static: nothing to redraw during a session ---------- */
  .scene { position: fixed; inset: 0; z-index: -1; overflow: hidden; background: var(--sky); }
  .waves { position: absolute; left: -10%; top: -10%; width: 120%; height: 120%; pointer-events: none; }
  @keyframes turn { to { transform: rotate(360deg); } }
  @media (prefers-color-scheme: dark) { body { background: #0a2a6a; } }

  /* ---------- glass and gel ---------- */
  .glass {
    position: relative; border-radius: 34px; border: 1px solid var(--rim);
    background: linear-gradient(180deg, var(--glass-a) 0%, var(--glass-b) 46%, var(--glass-b) 100%);
    -webkit-backdrop-filter: blur(24px) saturate(175%); backdrop-filter: blur(24px) saturate(175%);
    box-shadow: inset 0 1px 0 var(--hl), inset 0 -22px 44px -30px var(--hl), 0 28px 64px -22px var(--drop), 0 2px 6px rgba(8, 50, 100, .14);
  }
  .glass::before {  /* the curved top sheen */
    content: ""; position: absolute; inset: 1px 1px auto 1px; height: 84px; pointer-events: none; z-index: 0;
    border-radius: 33px 33px 60% 60% / 33px 33px 26px 26px;
    background: linear-gradient(180deg, var(--hl), transparent); opacity: .42;
  }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    :root { --glass-a: rgba(255, 255, 255, .93); --glass-b: rgba(240, 250, 255, .88); }
    @media (prefers-color-scheme: dark) { :root { --glass-a: rgba(26, 48, 88, .95); --glass-b: rgba(10, 24, 54, .95); } }
  }

  /* ---------- shell ---------- */
  .app {
    height: 100vh; height: 100dvh; max-width: 1120px; margin: 0 auto;
    padding: clamp(12px, 3.4vh, 36px) clamp(12px, 3vw, 40px);
    display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px;
  }
  .rail { align-self: start; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px 10px; border-radius: 30px; }
  .rail::before { border-radius: 29px 29px 50% 50% / 29px 29px 18px 18px; height: 60px; }
  .nav {
    position: relative; z-index: 1; width: 74px; padding: 10px 0 8px; border-radius: 22px; border: 1px solid transparent;
    display: flex; flex-direction: column; align-items: center; gap: 1px;
    color: var(--muted); text-decoration: none; font-size: 14px; line-height: 1.3; transition: background .2s, color .2s;
  }
  .nav svg { width: 24px; height: 24px; margin-bottom: 3px; }
  .nav small { font-size: 10.5px; letter-spacing: .04em; opacity: .85; font-family: Frutiger, "Segoe UI", "Lucida Grande", system-ui, sans-serif; }
  .nav:hover { background: var(--inset); color: var(--text); }
  .nav[aria-current] {
    color: #fff; border-color: rgba(255, 255, 255, .55);
    background: linear-gradient(180deg, #6fd2fb 0%, #1b9be3 48%, #0b78c6 52%, #2aa9ea 100%);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .8), 0 8px 16px -8px rgba(5, 98, 168, .8);
    text-shadow: 0 1px 1px rgba(0, 50, 100, .45);
  }

  button.nav { font-family: inherit; background: none; cursor: pointer; margin-top: 10px; }
  .nav[aria-pressed="true"] { color: var(--text); background: var(--inset); border-color: var(--inset-rim); box-shadow: inset 0 1px 0 var(--hl); }

  .pane { min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  .scroll {
    position: relative; z-index: 1; flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--line) transparent;
    -webkit-mask: linear-gradient(transparent, #000 22px, #000 calc(100% - 22px), transparent);
    mask: linear-gradient(transparent, #000 22px, #000 calc(100% - 22px), transparent);
  }
  .scroll > div { max-width: 780px; margin: 0 auto; padding: 30px clamp(16px, 3vw, 30px) 26px; }
  .hero { display: none; text-align: center; }
  .hero h1 { margin: 0; font-size: clamp(26px, 4.2vw, 38px); font-weight: 300; letter-spacing: .06em; line-height: 1.35; }

  /* ---------- the dock and the orb ---------- */
  .stage {
    --level: 0; --orb: 62px; --o1: #b9f36b; --o2: #46c426; --o3: #0f7d14; --glow: rgba(30, 150, 30, .6);
    position: relative; z-index: 1; flex: none; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 18px;
    padding: 12px 26px 14px; border-top: 1px solid var(--inset-rim);
    background: linear-gradient(180deg, var(--inset), transparent);
    transition: --o1 .5s, --o2 .5s, --o3 .5s;
  }
  body[data-phase="connecting"] .stage, body[data-phase="live"] .stage { --o1: #a8ecff; --o2: #1fa8ea; --o3: #0562a8; --glow: rgba(10, 120, 210, .6); }
  body[data-phase="live"][data-state="thinking"] .stage { --o1: #fff2a8; --o2: #ffb520; --o3: #c56a00; --glow: rgba(230, 150, 0, .55); }
  body[data-phase="live"][data-state="speaking"] .stage { --o1: #c8fff1; --o2: #19c7ae; --o3: #04807a; --glow: rgba(0, 160, 150, .55); }
  body[data-view="stats"]:not([data-phase="live"]) .stage { display: none; }

  .status { justify-self: start; min-width: 0; font-size: 17px; letter-spacing: .04em; }
  .orb {
    width: var(--orb); height: var(--orb); padding: 0; border: 0; border-radius: 50%; position: relative; cursor: pointer; color: #fff;
    background:
      radial-gradient(92% 62% at 50% 102%, var(--o1) 0%, transparent 72%),
      radial-gradient(circle at 50% 34%, var(--o2) 0%, var(--o2) 34%, var(--o3) 100%);
    box-shadow:
      inset 0 0 0 1px rgba(255, 255, 255, .4),
      inset 0 calc(var(--orb) * .06) calc(var(--orb) * .12) rgba(0, 0, 0, .2),
      0 0 0 calc(var(--orb) * .04) rgba(255, 255, 255, .62),
      0 0 0 calc(var(--orb) * .04 + 1px) rgba(255, 255, 255, .9),
      0 calc(var(--orb) * .12) calc(var(--orb) * .26) calc(var(--orb) * -.04) var(--glow);
    transition: transform .12s ease-out, filter .3s, opacity .3s;
    -webkit-tap-highlight-color: transparent;
  }
  .orb::before {  /* specular highlight */
    content: ""; position: absolute; left: 11%; right: 11%; top: 4%; height: 47%; border-radius: 50%; z-index: 2; pointer-events: none;
    background: linear-gradient(180deg, rgba(255, 255, 255, .96), rgba(255, 255, 255, .1));
  }
  .orb:hover:not(:disabled) { filter: brightness(1.08) saturate(1.1); }
  .orb:active:not(:disabled) { transform: scale(.96); }
  .orb:disabled { cursor: default; }
  body[data-phase="reviewing"] .orb { filter: saturate(.45); opacity: .6; }
  .orb svg { position: absolute; inset: 0; margin: auto; width: 40%; height: 40%; z-index: 1; filter: drop-shadow(0 1px 1px rgba(0, 0, 0, .35)); display: none; }
  body:is([data-phase="idle"], [data-phase="reviewing"]) .orb .play { display: block; left: 5%; }
  body[data-phase="live"] .orb .stop { display: block; width: 32%; height: 32%; }
  .swirl {  /* caustics turning inside the orb */
    position: absolute; inset: 0; border-radius: 50%; opacity: 0; transition: opacity .4s; pointer-events: none;
    background: conic-gradient(from 0deg, transparent 0, rgba(255, 255, 255, .7) 18%, transparent 40%, rgba(255, 255, 255, .4) 62%, transparent 82%);
    animation: turn 2.2s linear infinite paused;
  }
  /* Only while connecting. Once the agent is in the room no CSS on the page animates continuously:
     every frame costs CPU that the local TTS needs (measured: ~50% of a core with animations, ~0 without).
     The avatar is the one thing that does keep drawing; it is capped at 30 frames a second and can be switched off */
  body[data-phase="connecting"] .swirl, body[data-phase="live"][data-state="initializing"] .swirl { opacity: 1; animation-play-state: running; }
  .ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .85); opacity: 0; pointer-events: none; }
  body[data-phase="live"] .ring.lvl {  /* grows with your voice */
    opacity: calc(.15 + var(--level) * .75); transform: scale(calc(1.16 + var(--level) * .5)); transition: transform .1s ease-out, opacity .1s;
    box-shadow: 0 0 calc(var(--orb) * .2) var(--glow);
  }
  .ring.rip { transition: transform .5s ease-out, opacity .5s; }
  body[data-phase="live"][data-state="speaking"] .ring.rip { opacity: .6; transform: scale(1.24); }  /* still rings, not a loop */
  body[data-phase="live"][data-state="speaking"] .ring.rip + .ring.rip { opacity: .3; transform: scale(1.5); }

  .eq { justify-self: end; display: flex; align-items: center; gap: 4px; height: 40px; visibility: hidden; }
  body[data-phase="live"] .eq { visibility: visible; }
  .eq i {
    width: 5px; height: calc(5px + var(--level) * var(--k) * 1px); border-radius: 3px; transition: height .09s ease-out, background .2s;
    background: linear-gradient(180deg, #fff, var(--o2)); box-shadow: 0 0 0 1px var(--inset-rim); opacity: .85;
  }
  .stage.voiced .eq i { background: linear-gradient(180deg, #eaffc0, #46c426); opacity: 1; }

  /* first visit: nothing but a greeting and the orb */
  body[data-view="practice"]:is([data-phase="idle"], [data-phase="connecting"]):not(:has(#captions > *)):not(:has(#review:not([hidden]))) {
    .pane { display: flex; justify-content: center; }
    .scroll { flex: none; -webkit-mask: none; mask: none; }
    .scroll > div { padding-bottom: 0; }
    .hero { display: block; }
    .stage { --orb: clamp(132px, 22vh, 176px); display: flex; flex-direction: column; gap: 30px; border: 0; background: none; padding: 44px 20px 40px; }
    .orb { order: -1; }
    .status { justify-self: auto; color: var(--muted); font-size: 16px; }
    .eq { display: none; }
    .orb:not(:disabled) { animation: breathe 5s ease-in-out infinite; }
    &[data-avatar="on"] {  /* the avatar greets you; the orb steps back to being the button */
      .avatar { flex: none; height: min(46vh, 440px); }
      .scroll > div { padding-top: 4px; }
      .stage { --orb: clamp(84px, 13vh, 112px); gap: 16px; padding: 22px 20px 30px; }
    }
  }
  @keyframes breathe { 50% { transform: scale(1.035); } }

  /* ---------- avatar: a column beside the captions. With data-avatar="off" the page is the orb-only layout ---------- */
  .avatar {
    display: none; position: relative; z-index: 1; min-width: 0; min-height: 0; opacity: 0; transition: opacity .7s;
    /* fades into the glass at the bottom and towards the captions */
    -webkit-mask: linear-gradient(#000 78%, transparent), linear-gradient(90deg, #000 84%, transparent); -webkit-mask-composite: source-in;
    mask: linear-gradient(#000 78%, transparent), linear-gradient(90deg, #000 84%, transparent); mask-composite: intersect;
  }
  .avatar[data-ready] { opacity: 1; }
  body[data-avatar="on"][data-view="practice"] {
    .pane { display: grid; grid-template-columns: min(40%, 400px) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
    .avatar { display: block; grid-area: 1 / 1; }
    .scroll { grid-area: 1 / 2; }
    .stage { grid-area: 2 / 1 / 3 / -1; }
  }

  /* ---------- captions ---------- */
  #captions { display: flex; flex-direction: column; gap: 12px; }
  #captions:empty { display: none; }
  .bubble {
    max-width: 82%; padding: 9px 17px; border-radius: 22px; white-space: pre-wrap; word-break: break-word; font-size: 17px; line-height: 1.7;
    border: 1px solid var(--inset-rim); animation: pop .28s ease-out;
  }
  .bubble.agent {
    align-self: flex-start; border-bottom-left-radius: 6px; background: linear-gradient(180deg, var(--agent-a), var(--agent-b));
    box-shadow: inset 0 1px 0 var(--hl), 0 8px 18px -10px var(--drop);
  }
  .bubble.me {
    align-self: flex-end; border-bottom-right-radius: 6px; background: linear-gradient(180deg, var(--me-a), var(--me-b));
    box-shadow: inset 0 1px 0 var(--hl), inset 0 14px 14px -12px var(--hl), 0 8px 18px -10px var(--drop);
  }
  .bubble .interim { opacity: .55; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px) scale(.98); } }

  /* ---------- panels (review, statistics) ---------- */
  section:not(#captions) {
    background: var(--inset); border: 1px solid var(--inset-rim); border-radius: 24px; padding: 18px 20px; margin-bottom: 16px;
    box-shadow: inset 0 1px 0 var(--hl);
  }
  #review { margin-top: 18px; scroll-margin-top: 12px; }
  h2 { font-size: 18px; font-weight: 500; letter-spacing: .03em; margin: 0 0 8px; }
  .score { color: var(--muted); margin-bottom: 12px; }
  .turn { border-top: 1px solid var(--line); padding: 12px 0; }
  .turn:first-of-type { border-top: 0; }
  .orig .mark { color: var(--bad); font-weight: 700; margin-right: 6px; }
  .orig .mark.unnatural { color: var(--warn); }
  .fixed { color: var(--good); }
  .fixed .mark { font-weight: 700; margin-right: 6px; }
  ul { margin: 6px 0 0; padding-left: 22px; }
  li { margin: 4px 0; font-size: 15px; }
  .type, .chip {
    display: inline-block; font-size: 12px; color: var(--muted); border: 1px solid var(--inset-rim); border-radius: 999px; padding: 0 8px;
    background: var(--inset); text-decoration: none;
  }
  .type { margin-left: 6px; }
  .chip { margin-right: 6px; }
  .note { color: var(--muted); }
  .bunpro { display: block; font-size: 14px; }
  .muted { color: var(--muted); }
  .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: turn 1s linear infinite; vertical-align: -1px; margin-right: 8px; }

  /* ---------- statistics ---------- */
  #statsView h3 { font-size: 14px; font-weight: 600; margin: 18px 0 6px; color: var(--muted); }
  #statsView h3:first-of-type { margin-top: 10px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 10px; }
  .heat-wrap { overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
  .heat-wrap svg { display: block; }
  .heat-legend { display: flex; align-items: center; gap: 3px; justify-content: flex-end; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .heat-legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .heat-legend span { margin: 0 4px; }
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 14px; }
  .tile {
    text-align: center; padding: 10px 6px; border-radius: 20px; border: 1px solid var(--inset-rim);
    background: linear-gradient(180deg, var(--agent-a), var(--agent-b) 55%, var(--inset));
    box-shadow: inset 0 1px 0 var(--hl), 0 8px 16px -12px var(--drop);
  }
  .tile b { display: block; font-size: 21px; font-weight: 500; line-height: 1.35; }
  .tile span { font-size: 12px; color: var(--muted); }
  @media (max-width: 560px) { .tiles { grid-template-columns: repeat(2, 1fr); } }
  svg.chart { width: 100%; height: auto; display: block; overflow: visible; }
  svg text { fill: var(--muted); font-size: 11px; font-family: inherit; }
  .grid { stroke: var(--line); stroke-width: 1; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--muted); margin: 2px 0 6px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .legend i.line { height: 2px; vertical-align: 3px; width: 14px; }
  .spots { list-style: none; padding: 0; margin: 0; }
  .spots li { display: flex; gap: 10px; align-items: baseline; padding: 8px 0; border-top: 1px solid var(--line); margin: 0; }
  .spots li:first-child { border-top: 0; }
  .spots .rank { color: var(--muted); width: 1.4em; text-align: right; flex: none; }
  .spots .what { flex: 1; min-width: 0; }
  .spots .ex { display: block; font-size: 13px; color: var(--muted); }
  .spots .n { color: var(--muted); font-size: 13px; flex: none; text-align: right; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips .chip { margin: 0; }
  .chips .topic { font-size: 13px; background: var(--inset); border: 1px solid var(--inset-rim); border-radius: 999px; padding: 3px 12px; }
  .won { color: var(--good); border-color: var(--good); padding: 2px 10px; }
  .lvl-row { display: flex; align-items: center; gap: 10px; margin: 6px 0; font-size: 13px; }
  .lvl-row .m { width: 76px; color: var(--muted); flex: none; white-space: nowrap; }
  .lvl-row .bar { flex: 1; display: flex; gap: 2px; height: 14px; }
  .lvl-row .bar i { display: block; height: 100%; }
  .lvl-row .bar i:first-child { border-radius: 7px 0 0 7px; }
  .lvl-row .bar i:last-child { border-radius: 0 7px 7px 0; }
  .lvl-row .bar i:only-child { border-radius: 7px; }
  .lvl-row .t { width: 2.5em; color: var(--muted); text-align: right; flex: none; }
  #tip {
    position: fixed; pointer-events: none; z-index: 10; background: var(--text); color: var(--bg);
    font-size: 13px; padding: 5px 11px; border-radius: 999px; white-space: nowrap; transform: translate(-50%, calc(-100% - 10px));
    box-shadow: 0 8px 18px -8px var(--drop);
  }
  /* per-session card */
  .card-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
  .card-row .tile b { font-size: 19px; }
  .delta { font-size: 12px; }
  .delta.up { color: var(--good); }
  .delta.down { color: var(--bad); }
  .longest { font-size: 14px; color: var(--muted); margin: 0 0 6px; }
  .longest q { color: var(--text); quotes: "「" "」"; }
  .todo { font-size: 14px; margin: 0 0 12px; }

  /* ---------- small screens: the rail lies down on top ---------- */
  @media (max-width: 720px) {
    .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); gap: 10px; padding: 10px; }
    .rail { flex-direction: row; justify-content: center; align-self: auto; padding: 6px 12px; border-radius: 26px; }
    .rail::before { display: none; }
    .nav { flex-direction: row; width: auto; gap: 7px; padding: 7px 14px; }
    .nav svg { margin: 0; width: 20px; height: 20px; }
    .nav small { display: none; }
    button.nav { margin: 0 0 0 6px; }
    body[data-avatar="on"][data-view="practice"] {  /* the avatar becomes a band above the captions */
      .pane { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(110px, 30vh) minmax(0, 1fr) auto; }
      .scroll { grid-area: 2 / 1; }
      .stage { grid-area: 3 / 1; }
    }
    .glass { border-radius: 28px; }
    .stage { padding: 10px 16px 12px; gap: 10px; }
    .status { font-size: 15px; }
    .bubble { max-width: 90%; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>

<script>
const { Room, RoomEvent, ParticipantEvent, Track, ParticipantKind } = LivekitClient;

const btn = document.getElementById("btn");
const stage = document.getElementById("stage");      // dock: orb + state label + mic bars
const scroller = document.getElementById("scroll");
const pillText = document.getElementById("pillText");
const captions = document.getElementById("captions");
const reviewEl = document.getElementById("review");

const STATE_LABELS = {
  idle: "はじめる", connecting: "接続中…", initializing: "準備中…",
  listening: "聞いています", thinking: "考えています", speaking: "話しています", ended: "おつかれさまでした",
};

let room = null;
let roomName = null;
let phase = "idle";          // idle | connecting | live | reviewing
const bubbles = new Map();   // segment id -> element

function setState(state) {
  document.body.dataset.state = state;  // the orb's colour and motion follow this in CSS
  pillText.textContent = STATE_LABELS[state] || state;
  avatar?.setActivity(state);           // anything that isn't listening/thinking/speaking is idle to the avatar
  showEmotion();
}

function setPhase(next) {
  phase = next;
  const onStats = !document.getElementById("statsView").hidden;
  // Start only works from the practice view; a live session can still be stopped from anywhere
  btn.disabled = next === "connecting" || next === "reviewing" || (onStats && next !== "live");
  document.body.dataset.phase = next;   // layout (hero vs dock) and the orb's glyph follow this in CSS
  const label = next === "live" ? "Stop" : next === "connecting" ? "Connecting" : "Start";
  btn.setAttribute("aria-label", label);
  btn.title = label;
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// ---------- avatar ----------
// Optional: if WebGL, the CDN or the model fails, this logs it and the page stays the orb-only page.
// Everything goes through AvatarController (avatar/); nothing here touches the model itself.
const avatarEl = document.getElementById("avatar");
const navAvatar = document.getElementById("navAvatar");
// full strength is a stage face (eyes shut, mouth wide); these suit a conversation
const EMOTION_STRENGTH = { happy: 0.3, surprised: 0.6, sad: 0.5, relaxed: 0.6 };
let avatar = null;           // AvatarController, once the model is on screen
let avatarLoad = "new";      // new | loading | ready | failed
let avatarOn = true;         // the rail toggle, remembered in this browser
let agentTrack = null;       // the agent's voice, for lip-sync
let agentEmotion = "neutral";
let calmTimer = 0;
try { avatarOn = localStorage.getItem("avatar") !== "off"; } catch {}

function syncAvatar() {
  const on = avatarOn && avatarLoad !== "failed";
  document.body.dataset.avatar = on ? "on" : "off";   // the layout makes room for it (or not) in CSS
  navAvatar.setAttribute("aria-pressed", on);
  if (on && avatarLoad === "new") loadAvatar();        // three.js and the model are only downloaded when wanted
  avatar?.setEnabled(on && document.body.dataset.view === "practice");  // off or out of sight: no drawing at all
}

async function loadAvatar() {
  avatarLoad = "loading";
  let loading;
  try {
    const { AvatarController } = await import("/avatar/AvatarController.js");
    loading = new AvatarController(avatarEl);
    await loading.load("/models/avatar.vrm");
    avatar = loading;
    avatarLoad = "ready";
    avatarEl.dataset.ready = "";
    avatar.setActivity(document.body.dataset.state);
    if (agentTrack) avatar.followAudio(agentTrack);
  } catch (err) {
    console.warn("Avatar unavailable, continuing without it:", err);
    loading?.dispose();
    avatarLoad = "failed";
    navAvatar.hidden = true;
  }
  syncAvatar();
}

// The agent names a feeling per reply (participant attribute avatar.emotion). It shows while that reply
// is spoken, lingers a moment, and gives way to the thinking/listening face.
function showEmotion() {
  clearTimeout(calmTimer);
  const state = document.body.dataset.state;
  if (state === "speaking") avatar?.setEmotion(agentEmotion, EMOTION_STRENGTH[agentEmotion]);
  else if (state === "listening") calmTimer = setTimeout(() => avatar?.setEmotion("neutral"), 4000);
  else avatar?.setEmotion("neutral");
}

function followAgentVoice(mediaStreamTrack) {
  agentTrack = mediaStreamTrack;
  avatar?.followAudio(agentTrack);
}

navAvatar.addEventListener("click", () => {
  avatarOn = !avatarOn;
  try { localStorage.setItem("avatar", avatarOn ? "on" : "off"); } catch {}
  syncAvatar();
});

// ---------- captions ----------
// STT finalizes each phrase as its own segment; consecutive segments from the same speaker are merged
// into one bubble (a turn) until the other side speaks.
let turn = null;  // { isMe, el, segs: Map(segmentId -> {text, final}) }

function showCaption(segmentId, text, isMe, final) {
  document.getElementById("emptyHint")?.remove();
  let t = bubbles.get(segmentId);
  if (!t) {
    if (!turn || turn.isMe !== isMe) {
      const el = document.createElement("div");
      el.className = "bubble " + (isMe ? "me" : "agent");
      captions.appendChild(el);
      turn = { isMe, el, segs: new Map() };
    }
    t = turn;
    bubbles.set(segmentId, t);
  }
  t.segs.set(segmentId, { text, final: final || !isMe });
  t.el.innerHTML = [...t.segs.values()]
    .map(s => `<span${s.final ? "" : ' class="interim"'}>${esc(s.text)}</span>`).join("");
  const nearBottom = scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 140;
  if (nearBottom) scroller.scrollTop = scroller.scrollHeight;
}

// The agent sends one stream per segment with text deltas; the user's speech arrives as a new
// stream per update with the full text so far. Accumulating per stream and replacing per segment handles both.
function onTranscription(reader, participantInfo) {
  const attrs = reader.info.attributes || {};
  const segmentId = attrs["lk.segment_id"] || reader.info.id;
  const isMe = participantInfo.identity === room?.localParticipant.identity;
  (async () => {
    let text = "";
    for await (const chunk of reader) {
      text += chunk;
      showCaption(segmentId, text, isMe, attrs["lk.transcription_final"] === "true");
    }
    // the final flag can arrive on the closing header
    const finalAttrs = reader.info.attributes || attrs;
    showCaption(segmentId, text, isMe, finalAttrs["lk.transcription_final"] === "true" || !isMe);
  })().catch(err => console.warn("caption stream", err));
}

// ---------- session ----------
async function start() {
  setPhase("connecting");
  setState("connecting");
  reviewEl.hidden = true;
  captions.innerHTML = "";
  bubbles.clear();
  turn = null;
  agentEmotion = "neutral";

  try {
    const res = await fetch("/api/token");
    if (!res.ok) throw new Error((await res.json()).error || res.statusText);
    const { url, token, room: name } = await res.json();
    roomName = name;

    room = new Room({ adaptiveStream: true, dynacast: true });
    room.registerTextStreamHandler("lk.transcription", onTranscription);

    room.on(RoomEvent.TrackSubscribed, (track) => {
      if (track.kind === Track.Kind.Audio) {
        const el = track.attach();
        el.dataset.lk = "1";
        document.body.appendChild(el);
        followAgentVoice(track.mediaStreamTrack);  // the element plays it; the avatar only listens in for lip-sync
      }
    });
    room.on(RoomEvent.TrackUnsubscribed, (track) => {
      track.detach().forEach(el => el.remove());
      if (track.mediaStreamTrack === agentTrack) followAgentVoice(null);
    });
    room.on(RoomEvent.ParticipantAttributesChanged, (changed, participant) => {
      if (participant.kind !== ParticipantKind.AGENT) return;
      if (changed["avatar.emotion"]) agentEmotion = changed["avatar.emotion"];
      if (changed["lk.agent.state"]) setState(changed["lk.agent.state"]);
      else if (changed["avatar.emotion"]) showEmotion();
    });
    room.on(RoomEvent.ParticipantConnected, (p) => {
      if (p.kind === ParticipantKind.AGENT) setState(p.attributes["lk.agent.state"] || "initializing");
    });
    room.on(RoomEvent.Disconnected, () => ended());

    // ask for the mic before joining, so a denied/missing mic is reported clearly instead of a silent session
    let micTrack;
    try {
      micTrack = await LivekitClient.createLocalAudioTrack({ echoCancellation: true, noiseSuppression: true, autoGainControl: true });
    } catch (err) {
      throw new Error(`microphone unavailable (${err.name}: ${err.message}). Allow mic access for this site in the browser, ` +
        `and for the browser in System Settings → Privacy & Security → Microphone`);
    }
    showMicLevel(micTrack.mediaStreamTrack);

    await room.connect(url, token);
    await room.startAudio();  // inside the click, so autoplay is allowed
    await room.localParticipant.publishTrack(micTrack, { source: Track.Source.Microphone });
    room.localParticipant.on(ParticipantEvent.IsSpeakingChanged, (speaking) => stage.classList.toggle("voiced", speaking));

    // agent may already be in the room
    const agent = [...room.remoteParticipants.values()].find(p => p.kind === ParticipantKind.AGENT);
    setState(agent ? (agent.attributes["lk.agent.state"] || "initializing") : "initializing");
    setPhase("live");
  } catch (err) {
    console.error(err);
    stopMicLevel();
    if (room) { const r = room; room = null; phase = "idle"; await r.disconnect(); }  // don't leave a half-open session
    setState("idle");
    setPhase("idle");
    reviewEl.hidden = false;
    reviewEl.innerHTML = err.message.startsWith("microphone")
      ? `<p class="muted">Couldn't start: ${esc(err.message)}.</p>`
      : `<p class="muted">Couldn't connect: ${esc(err.message)}.<br>
      Is <code>livekit-server --dev</code> running, and the agent in <code>dev</code> mode?</p>`;
  }
}

// ---------- mic level meter (shows the browser is really capturing audio) ----------
let meter = null;
function showMicLevel(mediaStreamTrack) {
  stopMicLevel();
  const ctx = new AudioContext();
  const analyser = ctx.createAnalyser();
  analyser.fftSize = 512;
  ctx.createMediaStreamSource(new MediaStream([mediaStreamTrack])).connect(analyser);
  const buf = new Uint8Array(analyser.fftSize);
  meter = { ctx, raf: 0, level: 0, at: 0 };
  const tick = () => {
    analyser.getByteTimeDomainData(buf);
    let peak = 0;
    for (const v of buf) peak = Math.max(peak, Math.abs(v - 128));
    // 0..1 in steps of 0.1, written at most ~8 times a second and only when it changes, so a quiet mic
    // causes no redraws at all. The ring around the orb and the bars in the dock scale with it in CSS
    const level = Math.round(Math.min(1, peak / 128 * 2.5) * 10) / 10;
    const now = performance.now();
    if (level !== meter.level && now - meter.at > 120) {
      meter.level = level; meter.at = now;
      stage.style.setProperty("--level", level);
    }
    meter.raf = requestAnimationFrame(tick);
  };
  tick();
}
function stopMicLevel() {
  if (!meter) return;
  cancelAnimationFrame(meter.raf);
  meter.ctx.close();
  meter = null;
  stage.style.setProperty("--level", 0);
}

async function stop() {
  if (room) await room.disconnect();  // fires Disconnected -> ended()
}

function ended() {
  // a failed connect also fires Disconnected; start()'s catch reports that, there is nothing to review
  if (phase !== "live") return;
  document.querySelectorAll("audio[data-lk]").forEach(el => el.remove());
  followAgentVoice(null);
  stopMicLevel();
  stage.classList.remove("voiced");
  setState("ended");
  room = null;
  setPhase("reviewing");
  pollReview(roomName);
}

// ---------- review ----------
const POLL_MS = 3000, POLL_LIMIT_MS = 3 * 60 * 1000;

async function pollReview(name) {
  const startedAt = Date.now();
  reviewEl.hidden = false;
  while (Date.now() - startedAt < POLL_LIMIT_MS) {
    let data;
    try {
      data = await (await fetch("/api/review?room=" + encodeURIComponent(name))).json();
    } catch (err) {
      data = { status: "error", error: err.message };
    }
    if (data.status === "done") {
      renderReview(data);
      setPhase("idle");
      reviewEl.scrollIntoView({ behavior: "smooth", block: "start" });
      return;
    }
    const msg = data.status === "saving" ? "Saving the conversation..."
      : data.status === "analyzing" ? "Checking your grammar..."
      : "Waiting for the server... " + esc(data.error || "");
    reviewEl.innerHTML = `<p class="muted"><span class="spinner"></span>${msg}</p>`;
    await new Promise(r => setTimeout(r, POLL_MS));
  }
  reviewEl.innerHTML = `<p class="muted">The review is taking longer than expected. Check <code>grammar_police.log</code>.
    A failed analysis is retried the next time <code>grammar_police.py</code> runs.</p>`;
  setPhase("idle");
}

function renderReview(r) {
  if (!r.judged) {
    reviewEl.innerHTML = `<h2>Review · ${esc(r.date)}</h2><p class="muted">No speech to review in this session.</p>`;
    return;
  }
  const turns = r.turns.map(t => {
    const mark = t.status === "incorrect" ? "✗" : "△";
    const fixed = t.corrected && t.corrected !== t.text
      ? `<div class="fixed"><span class="mark">✓</span>${esc(t.corrected)}</div>` : "";
    const issues = t.issues.map(i => `<li>
        ${esc(i.span)} → <b>${esc(i.correction)}</b><span class="type">${esc(i.type)}</span>
        <span class="note">${esc(i.note)}</span>
        ${i.bunpro_key ? `<a class="bunpro" href="${esc(i.url)}" target="_blank" rel="noopener">文法 ${esc(i.bunpro_key.split("-")[0])} ${esc(i.grammar)} — ${esc(i.meaning)}</a>` : ""}
      </li>`).join("");
    return `<div class="turn">
        <div class="orig"><span class="mark ${t.status}">${mark}</span>${esc(t.text)}</div>
        ${fixed}
        ${issues ? `<ul>${issues}</ul>` : ""}
      </div>`;
  }).join("");
  const patterns = r.patterns.length
    ? `<h2 style="margin-top:16px">Patterns</h2><ul>${r.patterns.map(p => `<li>${esc(p)}</li>`).join("")}</ul>` : "";
  reviewEl.innerHTML = `<h2>Review · ${esc(r.date)}</h2>
    ${r.card ? sessionCard(r.card, r) : `<div class="score">${r.correct}/${r.judged} turns correct</div>`}
    ${turns || `<p class="muted">No mistakes this time. よくできました。</p>`}
    ${patterns}`;
}

function delta(value, avg, fmt) {
  if (value == null || avg == null) return "";
  const d = value - avg;
  if (Math.abs(d) < 1e-9) return `<span class="delta">= your average</span>`;
  return `<span class="delta ${d > 0 ? "up" : "down"}">${d > 0 ? "↑" : "↓"} ${fmt(Math.abs(d))} vs avg</span>`;
}

function sessionCard(c, r) {
  const pct = v => Math.round(v * 100) + "%";
  return `<div class="card-row">
      <div class="tile"><b>${c.minutes}</b><span>min</span></div>
      <div class="tile"><b>${c.chars.toLocaleString()}</b><span>characters</span><br>${delta(c.chars, c.avg_chars, v => Math.round(v))}</div>
      <div class="tile"><b>${r.correct}/${r.judged}</b><span>correct</span><br>${delta(c.rate, c.avg_rate, pct)}</div>
    </div>
    ${c.longest ? `<p class="longest">Longest sentence: <q>${esc(c.longest)}</q></p>` : ""}
    ${c.review ? `<p class="todo">Review this: <a href="${esc(c.review.url)}" target="_blank" rel="noopener">${esc(c.review.level)} ${esc(c.review.grammar)}</a> <span class="muted">— ${esc(c.review.meaning)}</span></p>` : ""}`;
}

// ---------- statistics view ----------
const statsView = document.getElementById("statsView");
const practiceView = document.getElementById("practiceView");
const tip = document.getElementById("tip");

const TYPES = [  // fixed categorical order: color follows the type, never its rank
  ["particle", "Particle"], ["wa_ga", "は / が"], ["conjugation", "Conjugation"], ["word_choice", "Word choice"],
  ["register", "Register"], ["filler", "Filler"], ["other", "Other"],
];
const LEVELS = ["N5", "N4", "N3", "N2", "N1"];
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const parseDay = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const shortDay = s => { const d = parseDay(s); return `${MONTHS[d.getMonth()]} ${d.getDate()}`; };
const plural = (n, w) => `${n.toLocaleString()} ${w}${n === 1 ? "" : "s"}`;
const emptyNote = msg => `<p class="muted" style="font-size:14px">${msg}</p>`;

function showView(stats) {
  statsView.hidden = !stats;
  practiceView.hidden = stats;
  document.body.dataset.view = stats ? "stats" : "practice";
  document.getElementById("navStats").toggleAttribute("aria-current", stats);
  document.getElementById("navPractice").toggleAttribute("aria-current", !stats);
  scroller.scrollTop = 0;
  setPhase(phase);  // grey out Start while on the stats view
  syncAvatar();     // the avatar only draws on the practice view
  if (stats) loadStats();
}
window.addEventListener("hashchange", () => showView(location.hash === "#stats"));

// one shared hover tooltip for every element with data-tip
document.addEventListener("pointerover", e => {
  const el = e.target.closest?.("[data-tip]");
  if (!el) { tip.hidden = true; return; }
  tip.textContent = el.dataset.tip;
  tip.hidden = false;
});
document.addEventListener("pointermove", e => { tip.style.left = e.clientX + "px"; tip.style.top = e.clientY + "px"; });

async function loadStats() {
  statsView.innerHTML = `<section><p class="muted"><span class="spinner"></span>Loading statistics...</p></section>`;
  try {
    const res = await fetch("/api/stats");
    const s = await res.json();
    if (!res.ok) throw new Error(s.error || res.statusText);
    renderStats(s);
  } catch (err) {
    statsView.innerHTML = `<section><p class="muted">Couldn't load statistics: ${esc(err.message)}</p></section>`;
  }
}

function renderStats(s) {
  const t = s.totals;
  const weeks = s.weekly;
  const weekLabel = w => shortDay(w.week);
  statsView.innerHTML = `
    <section>
      <h2>Practice</h2>
      <p class="sub">${t.first_day ? `${plural(t.sessions, "session")} · ${t.minutes} min · ${t.chars.toLocaleString()} characters spoken since ${shortDay(t.first_day)}` : "No practice yet"}</p>
      ${heatmap(s.heatmap, s.generated)}
      <div class="tiles">
        <div class="tile"><b>${s.heatmap.daily_average}</b><span>daily average (turns)</span></div>
        <div class="tile"><b>${s.heatmap.days_learned_pct}%</b><span>days learned</span></div>
        <div class="tile"><b>${plural(s.heatmap.longest_streak, "day")}</b><span>longest streak</span></div>
        <div class="tile"><b>${plural(s.heatmap.current_streak, "day")}</b><span>current streak</span></div>
      </div>
    </section>

    <section>
      <h2>Weak spots</h2>
      <h3>What to review (recent mistakes count more)</h3>
      ${s.weak_spots.length ? `<ul class="spots">${s.weak_spots.map((w, i) => `<li>
          <span class="rank">${i + 1}</span>
          <span class="what">${w.key
            ? `<span class="chip">${esc(w.level)}</span><a href="${esc(w.url)}" target="_blank" rel="noopener">${esc(w.grammar)}</a> <span class="muted">— ${esc(w.meaning)}</span>`
            : `<span class="chip">type</span>${esc(typeName(w.type))}`}
            ${w.example ? `<span class="ex">e.g. ${esc(w.example)}</span>` : ""}</span>
          <span class="n">×${w.count}<br>${shortDay(w.last_seen)}</span>
        </li>`).join("")}</ul>` : emptyNote("No mistakes recorded yet.")}
      <h3>Mistakes by type per week</h3>
      ${typeChart(weeks)}
      <h3>Fixed</h3>
      ${!s.fixed_enough_data ? emptyNote("Needs a few more sessions: grammar points you used to miss and haven't missed in your last 3 sessions show up here.")
        : s.fixed.length ? `<div class="chips">${s.fixed.map(f => `<a class="chip won" href="${esc(f.url)}" target="_blank" rel="noopener" data-tip="Missed ${f.misses}× · last on ${shortDay(f.last_missed)}">✓ ${esc(f.level)} ${esc(f.grammar)}</a>`).join("")}</div>`
        : emptyNote("Nothing fixed yet. Points you used to miss and haven't missed in your last 3 sessions will appear here.")}
    </section>

    <section>
      <h2>Habit &amp; volume</h2>
      <h3>Characters spoken per week</h3>
      ${weeks.length ? barChart(weeks, {
        value: w => w.chars, label: weekLabel, color: "var(--me)",
        tip: w => `Week of ${weekLabel(w)} · ${w.chars.toLocaleString()} characters · ${w.minutes} min`,
      }) : emptyNote("Practice a few sessions to see your weekly volume.")}
    </section>

    <section>
      <h2>Accuracy</h2>
      <h3>Correct turns per session</h3>
      ${s.correct_rate.length ? `<div class="legend"><span><i style="background:var(--muted);opacity:.5;border-radius:50%"></i>each session</span><span><i class="line" style="background:var(--good)"></i>${s.correct_rate.length > 1 ? "3-session average" : ""}</span></div>` +
        lineChart(s.correct_rate, {
          max: 1, fmt: v => Math.round(v * 100) + "%", label: p => shortDay(p.date),
          dots: { value: p => p.rate, color: "var(--muted)", tip: p => `${shortDay(p.date)} · ${Math.round(p.rate * 100)}% of ${plural(p.turns, "turn")} correct` },
          line: { value: p => p.rolling, color: "var(--good)" },
        }) : emptyNote("Correct-turn rate appears after your first analyzed session.")}
      <h3>Incorrect vs unnatural per week</h3>
      ${weeks.some(w => w.incorrect + w.unnatural) ?
        legend([["✗ Incorrect", "var(--bad)"], ["△ Unnatural", "var(--warn)"]]) +
        stackedBars(weeks, [["incorrect", "var(--bad)"], ["unnatural", "var(--warn)"]], {
          get: (w, k) => w[k], label: weekLabel,
          tip: w => `Week of ${weekLabel(w)} · ✗ ${w.incorrect} incorrect · △ ${w.unnatural} unnatural · ✓ ${w.correct} correct`,
        }) : emptyNote("No mistakes recorded yet.")}
      <h3>Mistakes per 100 characters</h3>
      ${weeks.some(w => w.mistakes_per_100 != null) ? lineChart(weeks, {
        fmt: v => String(+v.toFixed(1)), label: weekLabel,
        line: { value: w => w.mistakes_per_100, color: "var(--accent)", dots: true,
                tip: w => `Week of ${weekLabel(w)} · ${w.mistakes_per_100} mistakes per 100 characters (${w.issues} in ${w.graded_chars.toLocaleString()})` },
      }) : emptyNote("Needs analyzed sessions.")}
    </section>

    <section>
      <h2>Level &amp; range</h2>
      <h3>JLPT level of the grammar in your mistakes</h3>
      ${s.levels.length ? legend(LEVELS.map(l => [l, `var(--lv-${l})`])) + s.levels.map(m => {
        const total = LEVELS.reduce((a, l) => a + m[l], 0);
        const [y, mo] = m.month.split("-");
        return `<div class="lvl-row"><span class="m">${MONTHS[mo - 1]} ${y}</span><span class="bar">${LEVELS.filter(l => m[l]).map(l =>
          `<i style="flex:${m[l]};background:var(--lv-${l})" data-tip="${MONTHS[mo - 1]} · ${l}: ${m[l]} of ${total}"></i>`).join("")}</span><span class="t">${total}</span></div>`;
      }).join("") + `<p class="sub" style="margin-top:8px">Everyday spoken Japanese is mostly N5–N4 grammar (roughly two-thirds or more), even in polite speech. N3–N2 adds nuance, hedging and keigo (お〜になる, いたす, 〜かと思います). N1 is mostly written or formal, so it's rare in conversation. Mostly N5–N4 here is normal; N3–N2 showing up means you're reaching for more nuance.</p>` : emptyNote("No Bunpro-tagged mistakes yet.")}
      <h3>Average turn length (characters)</h3>
      ${s.turn_length.length ? lineChart(s.turn_length, {
        fmt: v => Math.round(v), label: p => shortDay(p.date),
        line: { value: p => p.avg, color: "var(--me)", dots: true,
                tip: p => `${shortDay(p.date)} · ${p.avg} characters per turn (${plural(p.turns, "turn")})` },
      }) : emptyNote("Needs analyzed sessions.")}
      <h3>Topics covered · ${s.topics.length}</h3>
      ${s.topics.length ? `<div class="chips">${s.topics.map(x => `<span class="topic">${esc(x)}</span>`).join("")}</div>` : emptyNote("Topics appear once your learner profile is built.")}
    </section>`;
  const wrap = statsView.querySelector(".heat-wrap");
  if (wrap) wrap.scrollLeft = wrap.scrollWidth;  // newest week in view
}

const typeName = k => (TYPES.find(([key]) => key === k) || [k, k])[1];

function legend(items) {
  return `<div class="legend">${items.map(([name, color]) => `<span><i style="background:${color}"></i>${esc(name)}</span>`).join("")}</div>`;
}

function typeChart(weeks) {
  const totals = Object.fromEntries(TYPES.map(([k]) => [k, weeks.reduce((a, w) => a + (w.issues_by_type[k] || 0), 0)]));
  const present = TYPES.filter(([k]) => totals[k]);
  if (!present.length) return emptyNote("No mistakes recorded yet.");
  return legend(present.map(([k, name]) => [`${name} ${totals[k]}`, `var(--t-${k})`])) +
    stackedBars(weeks, present.map(([k]) => [k, `var(--t-${k})`]), {
      get: (w, k) => w.issues_by_type[k] || 0, label: w => shortDay(w.week),
      tip: w => `Week of ${shortDay(w.week)} · ` + (present.filter(([k]) => w.issues_by_type[k]).map(([k, n]) => `${n} ${w.issues_by_type[k]}`).join(" · ") || "none"),
    });
}

// ---------- heatmap (review-heatmap style: weeks as columns, Mon..Sun as rows) ----------
function heatmap(h, generated) {
  const CELL = 10, GAP = 2, PITCH = CELL + GAP, LEFT = 26, TOP = 16, WEEKS = 53;
  const today = parseDay(generated);
  const start = new Date(today);
  start.setDate(start.getDate() - ((today.getDay() + 6) % 7) - (WEEKS - 1) * 7);  // Monday, 52 weeks back
  const counts = Object.values(h.days).map(d => d.turns).sort((a, b) => a - b);
  const q = p => counts[Math.min(counts.length - 1, Math.floor(p * counts.length))] || 0;
  const cuts = [q(0.25), q(0.5), q(0.75)];
  const shade = n => !n ? 0 : n <= cuts[0] ? 1 : n <= cuts[1] ? 2 : n <= cuts[2] ? 3 : 4;

  let cells = "", months = "", lastMonth = -1, lastLabelW = -99;
  for (let w = 0; w < WEEKS; w++) {
    for (let d = 0; d < 7; d++) {
      const day = new Date(start);
      day.setDate(start.getDate() + w * 7 + d);
      if (day > today) break;
      if (d === 0 && day.getMonth() !== lastMonth) {
        lastMonth = day.getMonth();
        // skip a label that would collide (the partial first month, or the last column)
        if (w > 0 && w < WEEKS - 2 && w - lastLabelW >= 3) {
          months += `<text x="${LEFT + w * PITCH}" y="10">${MONTHS[lastMonth]}</text>`;
          lastLabelW = w;
        }
      }
      const key = ymd(day), v = h.days[key];
      const tipText = `${shortDay(key)} · ${v ? `${plural(v.turns, "turn")} · ${v.minutes} min` : "no practice"}`;
      const ring = key === generated ? ` stroke="var(--text)" stroke-width="1"` : "";
      cells += `<rect x="${LEFT + w * PITCH}" y="${TOP + d * PITCH}" width="${CELL}" height="${CELL}" rx="2" fill="var(--heat-${shade(v?.turns)})"${ring} data-tip="${tipText}"/>`;
    }
  }
  const days = ["Mon", "", "Wed", "", "Fri", "", ""].map((l, i) => l && `<text x="0" y="${TOP + i * PITCH + 9}">${l}</text>`).join("");
  const W = LEFT + WEEKS * PITCH, H = TOP + 7 * PITCH;
  return `<div class="heat-wrap"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Practice calendar">${months}${days}${cells}</svg></div>
    <div class="heat-legend"><span>Less</span>${[0, 1, 2, 3, 4].map(i => `<i style="background:var(--heat-${i})"></i>`).join("")}<span>More</span></div>`;
}

// ---------- small SVG charts (one y-axis, recessive grid, rounded data-ends on the baseline) ----------
const CW = 680, CH = 170, PAD = { l: 36, r: 8, t: 8, b: 22 };

function niceMax(v) {  // 4 gridline steps, each a round number
  if (v <= 0) return 4;
  const s = v / 4, p = 10 ** Math.floor(Math.log10(s)), n = s / p;
  return 4 * (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
}

function frame(max, fmt, items, label) {
  const ih = CH - PAD.t - PAD.b, iw = CW - PAD.l - PAD.r;
  let g = "";
  for (let i = 0; i <= 4; i++) {
    const y = PAD.t + ih - (ih * i) / 4;
    g += `<line class="grid" x1="${PAD.l}" x2="${CW - PAD.r}" y1="${y}" y2="${y}"/><text x="${PAD.l - 6}" y="${y + 4}" text-anchor="end">${fmt((max * i) / 4)}</text>`;
  }
  const every = Math.max(1, Math.ceil(items.length / 8));
  const step = iw / items.length;
  items.forEach((it, i) => {
    if (i % every === 0) g += `<text x="${PAD.l + step * (i + 0.5)}" y="${CH - 6}" text-anchor="middle">${esc(label(it))}</text>`;
  });
  return { g, ih, iw, step, y: v => PAD.t + ih - (ih * v) / max };
}

function topRounded(x, y, w, h, r) {
  r = Math.min(r, w / 2, h);
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}

function barChart(items, o) {
  const max = niceMax(Math.max(...items.map(o.value)));
  const f = frame(max, v => Math.round(v).toLocaleString(), items, o.label);
  const bw = Math.min(28, f.step * 0.6);
  const bars = items.map((it, i) => {
    const v = o.value(it), x = PAD.l + f.step * (i + 0.5) - bw / 2, y = f.y(v);
    const hit = `<rect x="${PAD.l + f.step * i}" y="${PAD.t}" width="${f.step}" height="${f.ih}" fill="transparent" data-tip="${esc(o.tip(it))}"/>`;
    return (v ? `<path d="${topRounded(x, y, bw, PAD.t + f.ih - y, 4)}" fill="${o.color}"/>` : "") + hit;
  }).join("");
  return `<svg class="chart" viewBox="0 0 ${CW} ${CH}">${f.g}${bars}</svg>`;
}

function stackedBars(items, series, o) {
  const max = niceMax(Math.max(1, ...items.map(it => series.reduce((a, [k]) => a + o.get(it, k), 0))));
  const f = frame(max, v => Math.round(v), items, o.label);
  const bw = Math.min(28, f.step * 0.6);
  const bars = items.map((it, i) => {
    const x = PAD.l + f.step * (i + 0.5) - bw / 2;
    let base = 0, out = "";
    const segs = series.filter(([k]) => o.get(it, k) > 0);
    segs.forEach(([k, color], j) => {
      const v = o.get(it, k), y0 = f.y(base), y1 = f.y(base + v);
      const h = Math.max(1, y0 - y1 - (j ? 2 : 0));  // 2px surface gap between segments
      out += j === segs.length - 1
        ? `<path d="${topRounded(x, y1, bw, h, 4)}" fill="${color}"/>`
        : `<rect x="${x}" y="${y1}" width="${bw}" height="${h}" fill="${color}"/>`;
      base += v;
    });
    return out + `<rect x="${PAD.l + f.step * i}" y="${PAD.t}" width="${f.step}" height="${f.ih}" fill="transparent" data-tip="${esc(o.tip(it))}"/>`;
  }).join("");
  return `<svg class="chart" viewBox="0 0 ${CW} ${CH}">${f.g}${bars}</svg>`;
}

function lineChart(items, o) {
  const vals = [o.line && items.map(o.line.value), o.dots && items.map(o.dots.value)].flat().filter(v => v != null);
  const max = o.max ?? niceMax(Math.max(...vals));
  const f = frame(max, o.fmt, items, o.label);
  const x = i => PAD.l + f.step * (i + 0.5);
  let out = "";
  if (o.dots) items.forEach((it, i) => {
    out += `<circle cx="${x(i)}" cy="${f.y(o.dots.value(it))}" r="4" fill="${o.dots.color}" opacity=".45"/>`;
  });
  if (o.line) {
    let d = "", pen = false;
    items.forEach((it, i) => {
      const v = o.line.value(it);
      if (v == null) { pen = false; return; }
      d += `${pen ? "L" : "M"}${x(i)},${f.y(v)}`;
      pen = true;
    });
    out += `<path d="${d}" fill="none" stroke="${o.line.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    if (o.line.dots) items.forEach((it, i) => {
      const v = o.line.value(it);
      if (v != null) out += `<circle cx="${x(i)}" cy="${f.y(v)}" r="4" fill="${o.line.color}" stroke="var(--panel)" stroke-width="2"/>`;
    });
  }
  const tipOf = o.dots?.tip || o.line?.tip;
  items.forEach((it, i) => {
    const has = (o.line && o.line.value(it) != null) || (o.dots && o.dots.value(it) != null);
    if (has && tipOf) out += `<rect x="${PAD.l + f.step * i}" y="${PAD.t}" width="${f.step}" height="${f.ih}" fill="transparent" data-tip="${esc(tipOf(it))}"/>`;
  });
  return `<svg class="chart" viewBox="0 0 ${CW} ${CH}">${f.g}${out}</svg>`;
}

showView(location.hash === "#stats");

btn.addEventListener("click", () => (phase === "live" ? stop() : start()));
</script>
</body>
</html>
